<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KAOS makieta menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: szara makieta (wireframe) – sticky header z mega menu, pod nim prosty widok podstrony z okruszkami i blokami-placeholderami */
:root{
  --hero-bg:#23282e; --hero-fg:#f3f4f5;
  --bg:#f3f4f5; --surface:#ffffff; --fg:#1d2126; --muted:#68707a; --line:#d4d8dc; --block:#e3e6e9; --accent:#2b4a6b; --accent-fg:#ffffff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181b; --surface:#1d2125; --fg:#e7eaed; --muted:#9aa3ad; --line:#353b41; --block:#2a2f35; --accent:#8fb3d9; --accent-fg:#10161c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181b; --surface:#1d2125; --fg:#e7eaed; --muted:#9aa3ad; --line:#353b41; --block:#2a2f35; --accent:#8fb3d9; --accent-fg:#10161c; color-scheme:dark}

*{box-sizing:border-box}
body{overflow-x:clip;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.note{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--block);padding:8px 16px;text-align:center}
.note b{color:var(--fg);font-weight:500}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding-inline:24px;display:flex;align-items:center;gap:32px;height:72px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.logo-box{width:38px;height:38px;border:1.5px solid var(--fg);display:grid;place-items:center;font-family:var(--mono);font-size:11px}
.logo-word{font-weight:600;letter-spacing:.18em;font-size:16px}
nav.main{display:flex;gap:4px;flex:1}
.nav-link{background:none;border:0;padding:10px 12px;cursor:pointer;font-size:14.5px;font-weight:500;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.nav-link:hover,.nav-link.active{border-bottom-color:var(--fg)}
.nav-link .chev{width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.nav-link[aria-expanded="true"] .chev{transform:rotate(-135deg) translateY(-1px)}
.cta{background:var(--accent);color:var(--accent-fg);border:0;padding:11px 18px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.hdr-tel{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap}
.hdr-tel svg{width:17px;height:17px;fill:currentColor;flex:none}
.u-link{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;color:inherit}
.u-link:hover{text-decoration-thickness:2px}
@media (max-width:1180px){.hdr-tel span{position:absolute;left:-9999px}.hdr-tel{padding:8px}}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);width:42px;height:42px;cursor:pointer}
.burger span{display:block;width:18px;height:1.5px;background:var(--fg);margin:4px auto}

/* mega menu */
.mega{position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 18px 30px -18px rgba(0,0,0,.25)}
.mega-inner{max-width:1200px;margin:0 auto;padding:28px 24px 32px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.col h3{margin:0 0 14px;font-size:16px;font-weight:600}
.col h3 button{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:left}
.col h3 button:hover{text-decoration:underline}
.col ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.col li{border-bottom:1px solid var(--line)}
.col li button{width:100%;text-align:left;background:none;border:0;padding:9px 0;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:12px}
.col li button:hover{color:var(--accent)}
.col li button::after{content:"→";color:var(--muted)}
.col .all{margin-top:14px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:underline}

/* mobile drawer */
.drawer{border-top:1px solid var(--line);background:var(--surface);padding:8px 16px 20px;max-height:calc(100vh - 72px);overflow:auto}
.drawer .d-link{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;font-weight:500;cursor:pointer}
.drawer details{border-bottom:1px solid var(--line)}
.drawer summary{padding:14px 0;font-weight:500;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.drawer summary::after{content:"+"}
.drawer details[open]>summary::after{content:"–"}
.drawer details details{border:0;margin-left:12px}
.drawer details details summary{font-weight:400;padding:10px 0}
.drawer .sub{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 0 7px 24px;font-size:14px;color:var(--muted);cursor:pointer}
.drawer .cta{width:100%;margin-top:16px}

/* page */
main{max-width:1200px;margin:0 auto;padding:32px 24px 64px}
.crumbs{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline;font:inherit}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(26px,4vw,38px);line-height:1.15;margin:6px 0 14px;text-wrap:balance;font-weight:600}
.intro{max-width:62ch;color:var(--muted);margin:0 0 28px}
.ph{background:var(--block);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:12px;text-align:center;padding:16px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--fg)}
.card h3{margin:0;font-size:16px;font-weight:600}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.card ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.lines{display:grid;gap:8px;margin:20px 0}
.lines i{display:block;height:10px;background:var(--block)}
.lines i:nth-child(3n){width:70%}
.section{margin-top:56px}
.section h2{font-size:18px;font-weight:600;margin:0 0 14px}

.hero{margin-inline:calc(50% - 50vw);margin-top:-32px;margin-bottom:40px;background:var(--hero-bg);color:var(--hero-fg);position:relative;min-height:min(78vh,620px);display:flex;align-items:flex-end;overflow:hidden}
.hero .vid-label{position:absolute;top:20px;right:24px;font-family:var(--mono);font-size:12px;opacity:.7;display:flex;align-items:center;gap:10px}
.hero .play{width:64px;height:64px;border:1.5px solid currentColor;border-radius:50%;position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);opacity:.35}
.hero .play::after{content:"";position:absolute;left:26px;top:20px;border-left:16px solid currentColor;border-top:12px solid transparent;border-bottom:12px solid transparent}
.hero .hero-in{position:relative;width:100%;max-width:1200px;margin:0 auto;padding:48px 24px 56px}
.hero .tag{color:inherit;opacity:.7}
.hero h1{max-width:20ch;font-size:clamp(30px,5vw,54px)}
.hero p{max-width:56ch;margin:0 0 24px;opacity:.8}
.hero .cta{background:var(--hero-fg);color:var(--hero-bg)}

/* news: karuzela */
.news-ctrl{display:flex;align-items:center;gap:12px}
.arrow{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.arrow:hover{border-color:var(--fg)}
.news-track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 40px)/3);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:4px}
.news-track::-webkit-scrollbar{display:none}
.news-track>*{scroll-snap-align:start}
@media (max-width:960px){.news-track{grid-auto-columns:calc((100% - 20px)/2)}}
@media (max-width:560px){.news-track{grid-auto-columns:85%}.hero .vid-label{left:16px;right:auto}}

/* o kancelarii: tekst + zdjęcie */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:center}
.about h2{font-size:22px;margin:6px 0 14px}
.about p{margin:0 0 14px;max-width:58ch;color:var(--muted)}
.about p strong{color:var(--fg);font-weight:600}
.about .about-lead{font-size:clamp(18px,1.8vw,21px);line-height:1.4;color:var(--fg);font-weight:500;margin-bottom:20px;text-wrap:pretty}
.about .btn-outline{margin-top:14px}
.about-photo{aspect-ratio:4/3;width:100%}
.btn-outline{background:transparent;border:1.5px solid var(--fg);color:var(--fg);padding:11px 20px;font-weight:500;font-size:14px;cursor:pointer}
.btn-outline:hover{background:var(--fg);color:var(--bg)}
.center-btn{display:flex;justify-content:center;margin-top:24px}
@media (max-width:960px){.about{grid-template-columns:1fr;gap:28px}}

/* podstrona: page hero */
.subhero{margin-inline:calc(50% - 50vw);margin-top:-32px;background:var(--hero-bg);color:var(--hero-fg);position:relative;min-height:280px;display:flex;align-items:flex-end}
.subhero-in{width:100%;max-width:1200px;margin:0 auto;padding:40px 24px 44px}
.subhero .crumbs,.subhero .crumbs button{color:inherit;opacity:.75}
.subhero h1{font-size:clamp(32px,5vw,52px);margin:0 0 10px}
.subhero p{margin:0;max-width:56ch;opacity:.8}
.subhero-label{position:absolute;top:20px;right:24px;font-family:var(--mono);font-size:12px;opacity:.6}
@media (max-width:560px){.subhero-label{display:none}}

/* aktualności: kategorie, siatka, paginacja */
.pills-head{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:36px 0 12px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 32px;scroll-margin-top:140px}
.nav-link{text-decoration:none;color:inherit}.d-link{text-decoration:none}
.ext{font-size:.85em;color:var(--muted)}
.nav-static{cursor:default}.nav-link.nav-static:hover{border-bottom-color:transparent}
.team.team-all{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:40px}
@media (max-width:960px){.team.team-all{grid-template-columns:repeat(2,minmax(0,1fr))}}
.person p+p{margin-top:2px}
.f-col ul a{font-size:13.5px;text-decoration:none}.f-col ul a:hover{text-decoration:underline}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--fg)}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 24px}
.post-btn{display:flex;flex-direction:column;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.post-thumb{aspect-ratio:16/10;width:100%}
.thumb-wrap{position:relative}
.thumb-pill{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.post h3{margin:0;font-size:17px;font-weight:600;line-height:1.35;text-wrap:pretty}
.post-btn:hover h3{text-decoration:underline}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:48px;flex-wrap:wrap}
.pg{min-width:38px;height:38px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:13px}
.pg:hover{border-color:var(--fg)}
.pg[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pager .arrow:disabled{opacity:.35;cursor:default}
@media (max-width:960px){.posts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.posts{grid-template-columns:1fr}.pills{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}}


/* pojedynczy wpis */
.post-hero h1{max-width:none}
.post-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:18px}
.post-meta time{font-family:var(--mono);font-size:13px;opacity:.85}
.post-meta .sep{width:1px;height:18px;background:currentColor;opacity:.35}
.cat-pills{display:flex;flex-wrap:wrap;gap:8px}
.cat-pill{border:1px solid rgba(243,244,245,.45);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500;background:rgba(243,244,245,.08);color:inherit;cursor:pointer}
.cat-pill:hover{background:var(--hero-fg);color:var(--hero-bg)}
.variant{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:20px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.variant button{font:inherit;border:1px solid var(--line);background:var(--surface);padding:4px 10px;cursor:pointer}
.variant button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.article{max-width:none;margin:32px 0 0}
.article .post-cover{float:left;width:min(42%,300px);aspect-ratio:4/3;margin:6px 28px 16px 0}
.article::after{content:"";display:block;clear:both}
@media (max-width:560px){.article .post-cover{float:none;width:100%;margin:0 0 20px}}
.article .lead{font-size:clamp(18px,1.9vw,21px);line-height:1.5;font-weight:500;margin:0 0 24px;text-wrap:pretty}
.article h2{font-size:22px;font-weight:600;margin:40px 0 12px;line-height:1.3}
.article p,.article li{font-size:16.5px;line-height:1.7}
.article p{margin:0 0 16px}
.article ul,.article ol{margin:0 0 16px;padding-left:22px}
.article li{margin-bottom:6px}
.article figure{margin:32px 0}
.article figure .ph{aspect-ratio:3/2;width:100%}
.article figcaption{font-size:13px;color:var(--muted);margin-top:8px}
.sample-note{font-family:var(--mono);font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding:4px 0 4px 12px;margin:0 0 28px}
.faq{margin-top:48px;border-top:2px solid var(--fg);padding-top:20px}
.faq h2{margin-top:0}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:600;font-size:16px;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-weight:400;font-size:20px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:0 0 18px;color:var(--muted);font-size:15.5px}
.author{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:center;margin-top:48px;padding:20px;background:var(--surface);border:1px solid var(--line)}
.author .ph{width:72px;height:72px;border-radius:50%;padding:0;font-size:10px}
.author b{display:block;font-size:15px}
.author span{font-size:13px;color:var(--muted)}
.newsletter{margin-top:56px;background:var(--hero-bg);color:var(--hero-fg);padding:32px clamp(20px,4vw,40px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.newsletter h2{margin:0 0 6px;font-size:22px}
.newsletter p{margin:0;opacity:.8}
.nl-form{display:flex;gap:8px}
.nl-form input{flex:1;min-width:0;font:inherit;padding:11px 12px;border:1px solid rgba(243,244,245,.4);background:transparent;color:inherit}
.nl-form button{background:var(--hero-fg);color:var(--hero-bg);border:0;padding:11px 18px;font-weight:500;cursor:pointer}
.nl-consent{grid-column:1/-1;margin:0;font-size:12px;line-height:1.5;opacity:.7;max-width:none}
@media (max-width:760px){.newsletter{grid-template-columns:1fr}.nl-form{flex-direction:column}}


/* strona członka zespołu */
.bio{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:start}
.bio h1{font-size:clamp(32px,4.5vw,48px);margin:4px 0 6px}
.bio .role{font-size:17px;color:var(--muted);margin:0 0 24px}
.bio .bio-text p{font-size:16.5px;line-height:1.7;margin:0 0 16px}
.bio-facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;margin:24px 0;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14.5px}
.bio-facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.bio-facts dd{margin:0}
.bio-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.li-btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--fg);padding:9px 14px;font-weight:500;font-size:14px;cursor:default}
.li-btn svg{width:18px;height:18px;fill:currentColor}
.bio-photo{aspect-ratio:4/5;width:100%;position:sticky;top:96px}
@media (max-width:860px){.bio{grid-template-columns:1fr;gap:28px}.bio-photo{position:static;order:-1;max-width:420px}}
.areas.person-areas{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:960px){.areas.person-areas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.areas.person-areas{grid-template-columns:1fr}}


/* strony tekstowe */
.legal{margin-top:40px}
.toc{position:sticky;top:96px;font-size:13.5px}
.toc h2{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 10px}
.toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.toc a{display:block;padding:5px 0 5px 14px;text-decoration:none;color:var(--muted)}
.toc a:hover{color:var(--fg)}
.legal-body{max-width:none}
.legal-body h2{font-size:20px;font-weight:600;margin:36px 0 10px;scroll-margin-top:100px}
.legal-body h2:first-of-type{margin-top:0}
.legal-body p,.legal-body li{font-size:16px;line-height:1.7}
.legal-body p{margin:0 0 14px}
.legal-body ul{margin:0 0 14px;padding-left:22px}
.legal-body .sample-note{font-size:12px;line-height:1.5}
.legal-updated{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.f-bottom button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.f-bottom button:hover{text-decoration:underline}


/* kontakt */
.ct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;margin-top:40px;align-items:start}
.ct-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.ct-card{background:var(--surface);border:1px solid var(--line);padding:22px}
.ct-card.wide{grid-column:1/-1}
.ct-card h2{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 12px}
.ct-card p{margin:0 0 6px;font-size:15px}
.ct-card .big{font-size:18px;font-weight:600}
.ct-card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:0;font-size:14px}
.ct-card dt{color:var(--muted)}
.ct-card dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ct-form{background:var(--surface);border:1px solid var(--line);padding:32px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ct-form h2{grid-column:1/-1;margin:0;font-size:22px}
.ct-form .full{grid-column:1/-1}
.field .req{color:var(--accent)}
.field .err{color:#b42318;font-size:12px;display:none}
.field.invalid input,.field.invalid textarea{border-color:#b42318}
.field.invalid .err{display:block}
.consent.invalid{color:#b42318}
.map{margin-top:56px;height:380px;position:relative}

.q-who b{font-weight:600}
.q-who span{color:var(--muted);font-size:13px}
.q-logo{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);padding-left:20px;border-left:1px solid var(--line);height:40px}
.car-ctrl{display:flex;align-items:center;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.dots{display:flex;gap:6px;margin-left:8px}
.dots button{width:9px;height:9px;border-radius:50%;border:1px solid var(--fg);background:transparent;padding:0;cursor:pointer}
.dots button[aria-current="true"]{background:var(--fg)}
.team{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.person .ph{aspect-ratio:1/1;max-width:100%}
.person h3{margin:10px 0 0;font-size:15px;font-weight:600}
.person p{margin:0;font-size:13px;color:var(--muted)}
.logos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.logos div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:96px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);background:var(--surface)}
.lg1{font-weight:600;letter-spacing:.3em;font-size:15px}
.lg2{font-family:Georgia,serif;font-style:italic;font-size:20px}
.lg3{font-family:var(--mono);font-size:15px;letter-spacing:.05em}
.lg4{font-weight:300;font-size:22px;letter-spacing:-.02em}
.mk{width:20px;height:20px;border:2px solid currentColor;flex:none}
.mk.c{border-radius:50%}.mk.d{transform:rotate(45deg);width:15px;height:15px}.mk.f{background:currentColor}
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);background:var(--surface);border:1px solid var(--line)}
.contact .left{padding:32px;display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;align-content:start;border-right:1px solid var(--line)}
.contact .left .ph{aspect-ratio:4/5;max-width:100%}
.contact .left h3{margin:0 0 2px;font-size:18px;font-weight:600}
.contact .left .role{margin:0 0 16px;color:var(--muted);font-size:13px}
.contact dl{margin:0 0 20px;display:grid;gap:6px;font-size:14px}
.contact dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.contact dd{margin:0 0 6px;user-select:all}
.contact .cta-head{grid-column:1/-1}
.contact .cta-head h2{margin:0 0 6px;font-size:22px}
.contact .cta-head p{margin:0;color:var(--muted)}
.contact form{padding:32px;display:grid;gap:14px;grid-template-columns:1fr 1fr}
.contact .full{grid-column:1/-1}
.field{display:grid;gap:5px;font-size:13px}
.field input,.field textarea{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:0}
.field textarea{min-height:120px;resize:vertical}
.field .opt{color:var(--muted)}
.form-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.consent{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.btn-send{background:var(--fg);color:var(--bg);border:0;padding:12px 26px;font-weight:500;cursor:pointer}
.sent{font-size:13px;color:var(--accent)}

/* stopka */
footer.site{border-top:1px solid var(--line);background:var(--surface)}
.f-in{max-width:1200px;margin:0 auto;padding:48px 24px 32px;display:grid;grid-template-columns:1.3fr .8fr 1.3fr 1.3fr;gap:32px}
.f-area+.f-area{margin-top:20px}
.f-area h5{margin:0 0 8px;font-size:13.5px;font-weight:600}
.f-area h5 button{background:none;border:0;padding:0;cursor:pointer;font:inherit;text-align:left}
.f-area h5 button:hover{text-decoration:underline}
.f-area ul button{color:var(--muted)}
.f-brand p{margin:14px 0 0;color:var(--muted);font-size:14px;max-width:30ch}
.f-col h4{margin:0 0 12px;font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.f-col ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.f-col ul button{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:13.5px}
.f-col ul button:hover{text-decoration:underline}
.f-brand address{font-style:normal;font-size:13.5px;display:grid;gap:4px;margin:20px 0 16px}
.f-col .cta{padding:9px 14px;font-size:13px}
.f-bottom{max-width:1200px;margin:0 auto;padding:16px 24px 28px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (max-width:960px){
  .f-in{grid-template-columns:repeat(2,minmax(0,1fr))}.f-brand{grid-column:1/-1}
  .contact{grid-template-columns:1fr}.contact .left{border-right:0;border-bottom:1px solid var(--line)}
  .logos{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .q-logo{margin-left:0;padding-left:0;border-left:0;width:100%}
  .contact .left{grid-template-columns:1fr}.contact .left .ph{width:140px}
  .contact form{grid-template-columns:1fr;padding:24px}.contact .left{padding:24px}
  .f-in{grid-template-columns:1fr}
}

@media (max-width:960px){
  nav.main,.bar>.cta{display:none}

.cookie h2{margin:0 0 6px;font-size:16px}

.ck-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.ck-act .ck-yes{background:var(--fg);color:var(--bg)}

@media (max-width:480px){.cookie{left:16px;bottom:16px}}

<script>
const AREAS=[
 {id:"rynek-kapitalowy",name:"Rynek kapitałowy",lead:"Dla spółek publicznych, emitentów i inwestorów",
  items:["Spółki publiczne (GPW, NewConnect, Catalyst)","Emisje akcji"]},
 {id:"transakcje",name:"Transakcje i inwestycje",lead:"Gdy wchodzi inwestor, zmienia się właściciel lub forma spółki",
  items:["Umowy inwestycyjne","Transakcje nabycia udziałów i akcji (M&A)","Przekształcenia i łączenie spółek"]},
 {id:"obsluga",name:"Obsługa spółek i majątku",lead:"Stała opieka prawna i ochrona majątku",
  items:["Bieżąca obsługa prawna spółek kapitałowych","ASI i fundacje rodzinne","Nieruchomości"]},
 {id:"spory",name:"Spory i sytuacje kryzysowe",lead:"Gdy sprawa trafia do sądu lub firma jest pod presją",
  items:["Spory sądowe, instrumenty finansowe i zabezpieczenia","Restrukturyzacja i upadłość","Przestępczość gospodarcza (white-collar crime)"]}
];
const SIMPLE={
 "aktualnosci":{name:"Aktualności",intro:"Komentarze do zmian w prawie, sukcesy kancelarii, wydarzenia. Lista wpisów z filtrem po obszarze.",grid:["Wpis 1 · Rynek kapitałowy","Wpis 2 · Spory","Wpis 3 · Transakcje","Wpis 4","Wpis 5","Wpis 6"]},
};
const SVC_DESC={"Umowy inwestycyjne":"Negocjujemy i przygotowujemy umowy z inwestorami i wspólnikami.","Transakcje nabycia udziałów i akcji (M&A)":"Prowadzimy kupno i sprzedaż spółek: od badania due diligence po zamknięcie transakcji.","Przekształcenia i łączenie spółek":"Zmieniamy formę spółek i łączymy je sprawnie, bez przestojów w działalności.",
 "Spółki publiczne (GPW, NewConnect, Catalyst)":"Wspieramy emitentów w obowiązkach informacyjnych, walnych zgromadzeniach i ładzie korporacyjnym.","Emisje akcji":"Prowadzimy pozyskanie kapitału: od uchwały emisyjnej po rejestrację i wprowadzenie akcji do obrotu.",
 "Spory sądowe, instrumenty finansowe i zabezpieczenia":"Reprezentujemy w sporach gospodarczych i sporach o instrumenty finansowe, zabezpieczamy roszczenia.","Restrukturyzacja i upadłość":"Pomagamy uniknąć upadłości, a gdy do niej dochodzi, chronimy interes dłużnika lub wierzyciela.","Przestępczość gospodarcza (white-collar crime)":"Bronimy członków zarządu i firmy w sprawach karnych gospodarczych i skarbowych.",
 "Bieżąca obsługa prawna spółek kapitałowych":"Stałe wsparcie zarządu w codziennych sprawach korporacyjnych, umowach i uchwałach.","ASI i fundacje rodzinne":"Budujemy struktury, które chronią majątek i porządkują sukcesję w rodzinie.","Nieruchomości":"Transakcje, umowy i spory dotyczące nieruchomości komercyjnych i inwestycyjnych."};
const slug=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ł/g,"l").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

const $=s=>document.querySelector(s);
const view=$("#view"),mega=$("#mega"),specBtn=$("#spec-btn"),drawer=$("#drawer"),burger=$("#burger");

// mega menu columns (bez opisów obszarów)
$("#mega-cols").innerHTML=AREAS.map(a=>`
 <div class="col">
  <h3><button data-go="area:${a.id}">${a.name}</button></h3>
  <ul>${a.items.map(i=>`<li><button data-go="svc:${a.id}:${slug(i)}">${i}</button></li>`).join("")}</ul>
  <button class="all" data-go="area:${a.id}">Dowiedz się więcej →</button>
 </div>`).join("");

// mobile drawer
drawer.innerHTML=`
 <button class="d-link" data-go="home">Strona główna</button>
 <button class="d-link" data-go="o-kancelarii">O kancelarii</button>
 <details><summary>Specjalizacje</summary>
  ${AREAS.map(a=>`<details><summary>${a.name}</summary>
    ${a.items.map(i=>`<button class="sub" data-go="svc:${a.id}:${slug(i)}">${i}</button>`).join("")}
    <button class="sub" data-go="area:${a.id}"><u>Dowiedz się więcej</u></button>
  </details>`).join("")}
 </details>
 <button class="d-link" data-go="zespol">Zespół</button>
 <button class="d-link" data-go="baza-wiedzy">Baza wiedzy</button>
 <button class="d-link" data-go="aktualnosci">Aktualności</button>
 <button class="d-link" data-go="kontakt">Kontakt</button>
 <button class="cta" data-go="umow">Umów się on-line</button>`;

// mega open/close: click toggles, hover opens on desktop
let closeT;
function setMega(open){mega.hidden=!open;specBtn.setAttribute("aria-expanded",open)}
specBtn.addEventListener("click",()=>setMega(mega.hidden));
const canHover=matchMedia("(hover:hover)").matches;
if(canHover){
  [specBtn,mega].forEach(el=>{
    el.addEventListener("mouseenter",()=>{clearTimeout(closeT);setMega(true)});
    el.addEventListener("mouseleave",()=>{closeT=setTimeout(()=>setMega(false),180)});
  });
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){setMega(false)}});
document.addEventListener("click",e=>{if(!e.target.closest("#hdr"))setMega(false)});
burger.addEventListener("click",()=>{const o=drawer.hidden;drawer.hidden=!o;burger.setAttribute("aria-expanded",o)});

// routing
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]"); if(!b)return;
  go(b.dataset.go);
});
function crumbs(list){return `<nav class="crumbs" aria-label="Okruszki">${list.map((c,i)=>(i<list.length-1&&c[1]?`<button data-go="${c[1]}">${c[0]}</button>`:`<span>${c[0]}</span>`)+(i<list.length-1?`<span>/</span>`:"")).join("")}</nav>`}
const mail=m=>`<a class="u-link" href="mailto:${m}">${m}</a>`;
const tel=t=>`<a class="u-link" href="tel:${t.replace(/[^+0-9]/g,"")}">${t}</a>`;
const lines=n=>`<div class="lines">${"<i></i>".repeat(n)}</div>`;

function go(r){
  setMega(false);drawer.hidden=true;burger.setAttribute("aria-expanded",false);
  document.querySelectorAll(".nav-link").forEach(n=>n.classList.remove("active"));
  let html="";
  if(r==="home"){
    html=`<section class="hero"><div class="vid-label">Wideo w tle (pętla, bez dźwięku) · 100% szerokości</div><span class="play" aria-hidden="true"></span>
      <div class="hero-in"><span class="tag">Strona główna</span><h1>Kancelaria dla biznesu, który chce działać spokojnie i z wyprzedzeniem</h1><p>Hasło przewodnie i krótki opis kancelarii.</p><button class="cta" data-go="umow">Umów się on-line</button></div></section>
     <div class="section about"><div><span class="tag">O kancelarii</span><h2>Jak pracujemy</h2>
       <p class="about-lead">KAOS to kancelaria dla przedsiębiorców, spółek i inwestorów, którzy chcą działać spokojnie i z wyprzedzeniem.</p>
       <p>Prowadzimy <strong>transakcje i inwestycje</strong>, sprawy z zakresu <strong>rynku kapitałowego</strong>, <strong>spory i sytuacje kryzysowe</strong>, a także bieżącą <strong>obsługę spółek i ich majątku</strong>.</p>
       <p>Zanim zaproponujemy rozwiązanie, <strong>poznajemy cele klienta, ryzyka i ludzi</strong>, którzy podejmują decyzje. Dzięki temu klient zawsze wie, na jakim etapie jest sprawa, i może spokojnie prowadzić swój biznes.</p>
       <p>Każdą sprawą <strong>kieruje partner</strong>, który zna ją od pierwszego spotkania. Mówimy wprost o ryzykach, kosztach i możliwych scenariuszach, a <strong>rekomendację dajemy zawsze konkretną</strong>: co zrobić, kiedy i dlaczego.</p>
       <button class="btn-outline" data-go="o-kancelarii">Dowiedz się więcej o kancelarii</button></div>
      <div class="ph about-photo">Zdjęcie (zespół / biuro / spotkanie z klientem)</div></div>`+homeExtra();
  } else if(r==="specjalizacje"){
    html=crumbs([["Strona główna","home"],["Specjalizacje"]])+`<h1>Specjalizacje</h1><p class="intro">Przegląd czterech obszarów.</p>
     <div class="grid">${AREAS.map(a=>`<button class="card" data-go="area:${a.id}"><h3>${a.name}</h3><ul>${a.items.map(i=>`<li>${i}</li>`).join("")}</ul></button>`).join("")}</div>`;
  } else if(r.startsWith("area:")){
    const a=AREAS.find(x=>x.id===r.slice(5))||AREAS[0];specBtn.classList.add("active");
    html=`<section class="subhero"><div class="subhero-in">${crumbs([["Strona główna","home"],["Specjalizacje"],[a.name]])}<h1>${a.name}</h1><p>${a.lead}. Krótki opis obszaru: dla kogo jest i z jakimi sprawami przychodzą do nas klienci.</p></div><span class="subhero-label">Zdjęcie w tle (opcjonalnie)</span></section>
     <section class="section"><div class="sec-head"><h2>Usługi w tym obszarze</h2></div>
      <div class="svc-tiles${a.items.length===2?" two":""}">${a.items.map((it,k)=>`<button class="svc-tile" data-go="svc:${a.id}:${slug(it)}"><div class="ph svc-art">Grafika</div><span class="num">0${k+1}</span><h3>${it}</h3><p>${SVC_DESC[it]||""}</p><span class="svc-go">Zobacz usługę →</span></button>`).join("")}</div></section>`;
  } else if(r.startsWith("svc:")){
    const [,aid,sid]=r.split(":");const a=AREAS.find(x=>x.id===aid)||AREAS[0];const name=a.items.find(i=>slug(i)===sid)||a.items[0];specBtn.classList.add("active");
    html=svcView(a,name);
  } else if(r==="zespol"){
    document.querySelector('.nav-link[data-go="zespol"]').classList.add("active");
    html=`<section class="subhero"><div class="subhero-in">${crumbs([["Strona główna","home"],["Zespół"]])}<h1>Zespół</h1><p>Partnerzy i prawnicy kancelarii. Każda osoba z krótkim bio i przypisaniem do obszarów specjalizacji.</p></div><span class="subhero-label">Zdjęcie w tle (opcjonalnie)</span></section>
     <div class="team team-all">${TEAM.map(personCard).join("")}</div>`;
  } else if(r.startsWith("person:")){
    document.querySelector('.nav-link[data-go="zespol"]').classList.add("active");
    html=personView(TEAM[+r.slice(7)]||TEAM[0]);
  } else if(r==="umow"){
    html=bookView();
  } else if(r.startsWith("book:")){
    html=bookingView(r.slice(5));
  } else if(r==="o-kancelarii"){
    document.querySelector('.nav-link[data-go="o-kancelarii"]').classList.add("active");
    html=aboutView();
  } else if(r==="404"){
    html=notFoundView();
  } else if(r==="kontakt"){
    document.querySelector('.nav-link[data-go="kontakt"]').classList.add("active");
    html=contactView();
  } else if(r.startsWith("txt:")){
    html=textPage(TEXT_PAGES[r.slice(4)]);
  } else if(r==="post"||r==="kb-post"){
    FEED=r==="post"?"aktualnosci":"baza-wiedzy";curArticle=r==="post"?ARTICLE:KB_ARTICLE;
    document.querySelector(`.nav-link[data-go="${FEED}"]`).classList.add("active");
    html=postView(curArticle,FEED);
  } else if(r==="aktualnosci"||r==="baza-wiedzy"){
    FEED=r;document.querySelector(`.nav-link[data-go="${r}"]`).classList.add("active");
    html=listView(r);
  } else if(SIMPLE[r]){
    const p=SIMPLE[r];const nb=document.querySelector(`.nav-link[data-go="${r}"]`);if(nb)nb.classList.add("active");
    html=crumbs([["Strona główna","home"],[p.name]])+`<h1>${p.name}</h1><p class="intro">${p.intro}</p>`+
     (p.grid?`<div class="grid">${p.grid.map(g=>`<div class="card" style="cursor:default"><div class="ph" style="height:110px">Zdjęcie</div><h3>${g}</h3></div>`).join("")}</div>`
            :`<div class="grid">${p.blocks.map(b=>`<div class="ph" style="height:130px">${b}</div>`).join("")}</div>`+lines(5));
  } else {
    html=notFoundView();
  }
  view.innerHTML=html;if(r==="home")initHome();if(r==="aktualnosci"||r==="baza-wiedzy")renderNews();if(r==="post"||r==="kb-post")renderPostCats();if(r==="kontakt")initContact();syncCookie(r);if(r.startsWith("svc:")){sqSync();const f=document.getElementById("cform");if(f)f.addEventListener("submit",e=>{e.preventDefault();document.getElementById("sent").hidden=false})}if(r==="o-kancelarii")gcSync();if(r.startsWith("book:"))renderCal();window.scrollTo(0,0);

   <h2>Czym jest rejestr akcjonariuszy</h2>
   <p>Rejestr akcjonariuszy to elektroniczna ewidencja akcji spółek niepublicznych. Prowadzi go podmiot uprawniony do prowadzenia rachunków papierów wartościowych, na przykład dom maklerski, wybrany uchwałą walnego zgromadzenia.</p>

function initContact(){

 form.addEventListener("submit",e=>{e.preventDefault();let ok=true;
  form.querySelectorAll(".field").forEach(l=>{const el=l.querySelector("input,textarea");const bad=el.required&&!el.value.trim();l.classList.toggle("invalid",bad);if(bad)ok=false});

  document.getElementById("c-sent").hidden=!ok;});
}

function gcSync(){const g=document.getElementById("gc");if(!g)return;const mid=innerHeight/2;let best=0,bd=1e9;
 const R=g.getBoundingClientRect();g.style.setProperty("--p",Math.min(1,Math.max(0,(mid-R.top)/R.height)).toFixed(3));
 g.querySelectorAll(".gc-step").forEach((el,i)=>{const r=el.getBoundingClientRect(),d=Math.abs(r.top+r.height/2-mid);if(d<bd){bd=d;best=i}});
 g.querySelectorAll("[data-k]").forEach(e=>{const k=+e.dataset.k;e.classList.toggle("on",k===best);e.classList.toggle("past",k<best)});g.dataset.s=best}

function initHome(){
 let i=0;const s=document.getElementById("slide");if(!s)return;
 const show=n=>{i=(n+QUOTES.length)%QUOTES.length;const q=QUOTES[i];
  s.innerHTML=opInner(q);
  document.querySelectorAll("[data-dot]").forEach(d=>d.setAttribute("aria-current",+d.dataset.dot===i))};
 document.getElementById("prev").onclick=()=>show(i-1);document.getElementById("next").onclick=()=>show(i+1);
 document.querySelectorAll("[data-dot]").forEach(d=>d.onclick=()=>show(+d.dataset.dot));show(0);
 const tr=document.getElementById("news-track");const step=()=>tr.firstElementChild.getBoundingClientRect().width+20;
 document.getElementById("n-prev").onclick=()=>tr.scrollBy({left:-step()});document.getElementById("n-next").onclick=()=>tr.scrollBy({left:step()});
 document.getElementById("cform").addEventListener("submit",e=>{e.preventDefault();document.getElementById("sent").hidden=false});
}
